
services:
  doc-service:
    build:
      context: ./doc-service-python
      dockerfile: Dockerfile
    container_name: tmt-doc-service
    ports:
      - "8000:8000"
    environment:
      - TMT_API_URL=https://tmt.ilprl.ku.edu.np/lang-translate
      - TMT_API_KEY=${TMT_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: tmt-frontend
    ports:
      - "3000:3000"
    depends_on:
      doc-service:
        condition: service_healthy
    restart: unless-stopped
