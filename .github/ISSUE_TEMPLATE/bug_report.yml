name: Bug Report
description: Report a bug or unexpected behaviour
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I upload a PDF and click Translate, the progress bar freezes at 0%."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload a file larger than 500 KB
        2. Select English → Nepali
        3. Click Translate
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: Translation should stream segment-by-segment progress.
    validations:
      required: true

  - type: dropdown
    id: file-type
    attributes:
      label: File format
      options: [PDF, DOCX, CSV, TSV, Not applicable]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: Paste browser console output or Docker logs here.
      render: shell

  - type: input
    id: os
    attributes:
      label: OS / Browser
      placeholder: "macOS 14 / Chrome 124"
