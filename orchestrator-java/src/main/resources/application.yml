server:
  port: 8080

spring:
  application:
    name: tmt-orchestrator
  threads:
    virtual:
      enabled: true
  codec:
    max-in-memory-size: 10MB
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  doc-service-url: ${APP_DOC_SERVICE_URL:http://localhost:8000}
  tmt-api:
    mock: ${APP_TMT_API_MOCK:true}
    url: ${APP_TMT_API_URL:https://tmt.ilprl.ku.edu.np/lang-translate}
    key: ${APP_TMT_API_KEY:}
    batch-size: 100
    max-chars-per-batch: 20000
    retry:
      max-attempts: 3
      initial-delay-ms: 200
  cache:
    max-size: 50000
    expire-hours: 6

logging:
  level:
    com.tmt: DEBUG
